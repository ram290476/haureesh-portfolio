<script>
(function () {
  var theme = "editorial";
  var allowed = { editorial: 1, midnight: 1, minimal: 1, gradient: 1, glass: 1, contrast: 1 };
  try {
    var stored = localStorage.getItem("theme");
    if (stored && allowed[stored]) theme = stored;
  } catch (e) {}
  document.documentElement.setAttribute("data-theme", theme);
  var fonts = {
    editorial: "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap",

    glass: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap",
    contrast: "https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
  };
  var href = fonts[theme];
  if (!href) return;
  document.write('<link rel="preconnect" href="https://fonts.googleapis.com">');
  document.write('<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>');
  document.write('<link rel="stylesheet" id="theme-fonts" href=\'' + href.replace(/&/g, "&amp;") + '\'>');
})();
</script>
